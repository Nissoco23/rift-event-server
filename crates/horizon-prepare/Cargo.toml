[package]
name = "horizon-prepare"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true
description = "Prepares the server's game files from your own Minecraft (rift-prepare): imports and checks the pinned jars, runs the vanilla exporters, writes the resource folder"

[dependencies]
crc32fast = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "horizon-prepare"
path = "src/main.rs"
