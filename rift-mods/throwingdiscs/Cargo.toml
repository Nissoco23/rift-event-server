[package]
name = "throwingdiscs"
description = "Throwing discs for Rift Event Server: a port of the Paper plugin, as a native mod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The engine's library, for `horizon_client::mod_api`: the server build, as rift-engine has it.
horizon-client = { path = "../../crates/horizon-client", default-features = false }
serde = { version = "1", features = ["derive"] }
# The look of the mod's messages.
rift-chat = { path = "../../crates/rift-chat" }
# The mod's own config/throwingdiscs.toml.
toml = "1.1"
serde_json = "1"

[lints]
workspace = true
