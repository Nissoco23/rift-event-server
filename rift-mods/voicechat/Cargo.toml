[package]
name = "voicechat"
description = "Voice chat for Rift Event Server: a server for the Simple Voice Chat protocol, as a native mod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The engine's library, for `horizon_client::mod_api`: the server build, as rift-engine has it.
horizon-client = { path = "../../crates/horizon-client", default-features = false }
serde = { version = "1", features = ["derive"] }
# The look of the mod's messages.
rift-chat = { path = "../../crates/rift-chat" }
# The mod's own config/voicechat.toml.
toml = "1.1"
# AES-128-GCM for the voice packets, and the random secrets. Already in Cargo.lock.
ring = "0.17"

[lints]
workspace = true
