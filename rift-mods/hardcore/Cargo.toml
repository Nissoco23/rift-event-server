[package]
name = "hardcore"
description = "Hardcore rules for Rift Event Server: death protection, what happens on death and what the others are told"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The engine's library, for `horizon_client::mod_api`: the server build, as rift-engine has it.
horizon-client = { path = "../../crates/horizon-client", default-features = false }
serde = { version = "1", features = ["derive"] }
# The look of the mod's messages.
rift-chat = { path = "../../crates/rift-chat" }
# The mod's own config/hardcore.toml.
toml = "1.1"

[lints]
workspace = true
