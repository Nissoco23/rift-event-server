[package]
name = "nick"
description = "Operator nicknames for Rift Event Server: a name and a skin in place of a player's, chosen or drawn from a pool"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The engine's library, for `horizon_client::mod_api` and the profile lookup: the server build, as
# rift-engine has it.
horizon-client = { path = "../../crates/horizon-client", default-features = false }
serde = { version = "1", features = ["derive"] }
# The pinned skins, config/nick-skins.json.
serde_json = "1"
# The mod's own config/nick.toml.
toml = "1.1"
# Chat text in Rift's message style.
rift-chat = { path = "../../crates/rift-chat" }

[lints]
workspace = true
