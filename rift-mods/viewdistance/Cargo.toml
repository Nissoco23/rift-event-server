[package]
name = "viewdistance"
description = "Per-player view distance limits for Rift Event Server: one distance for players, another for operators"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The engine's library, for `horizon_client::mod_api`: the server build, as rift-engine has it.
horizon-client = { path = "../../crates/horizon-client", default-features = false }
serde = { version = "1", features = ["derive"] }
# The mod's own config/viewdistance.toml.
toml = "1.1"

[lints]
workspace = true
